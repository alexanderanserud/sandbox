name: Template CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify canonical template release
        if: github.repository == 'polycorp-ai/polycorp-shadcn-nextjs'
        run: npm run release:check
      - name: Verify generated repository
        if: github.repository != 'polycorp-ai/polycorp-shadcn-nextjs'
        run: npm run verify
